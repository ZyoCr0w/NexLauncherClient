name: Compilar NexClient

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - carpeta: forge-1.8.9
            java: 17
            nombre: NexClient-1.8.9-forge.jar
          - carpeta: fabric-1.21.1
            java: 25  # Loom lo pide para compilar; el mod sigue siendo Java 21
            nombre: NexClient-1.21.1-fabric.jar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        working-directory: ${{ matrix.carpeta }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../gradle.log
      - name: Publicar errores como anotaciones
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lineas = open("gradle.log", encoding="utf-8", errors="replace").read().splitlines()
          clave = re.compile(r"error:|ERROR|What went wrong|Exception|FAILURE|Could not|Mixin|> ")
          vistos, trozos = set(), []
          for i, l in enumerate(lineas):
              if clave.search(l):
                  for j in range(i, min(len(lineas), i + 4)):
                      if j not in vistos:
                          vistos.add(j); trozos.append(lineas[j][:400])
          trozos = trozos[:400]
          for k in range(0, len(trozos), 40):
              texto = "%0A".join(t.replace("%", "%25").replace("\r", "") for t in trozos[k:k + 40])
              print(f"::error title=gradle {k // 40}::{texto}")
          PY
      - name: Avisos de mixins
        if: success()
        run: |
          grep -iE "mixin|refmap|unable to locate|cannot find|could not find|warning:" gradle.log | grep -v "Using of the official" | head -40 | sed 's/^/::warning title=aviso::/' || echo "::notice title=aviso::sin avisos de mixins"
      - name: Preparar el .jar
        run: |
          mkdir -p salida
          jar=$(ls ${{ matrix.carpeta }}/build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          echo "Jar: $jar"
          cp "$jar" "salida/${{ matrix.nombre }}"
          (cd salida && sha256sum "${{ matrix.nombre }}" | cut -d' ' -f1 > "${{ matrix.nombre }}.sha256")
          ls -l salida
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: salida/*

  publicar:
    # Crea el release v<mod_version> la primera vez que esa versión llega a main (o con una etiqueta v*)
    needs: compilar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versión
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^mod_version=' fabric-1.21.1/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "nuevo=no" >> "$GITHUB_OUTPUT"; else echo "nuevo=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v5
        if: steps.v.outputs.nuevo == 'si'
        with:
          path: salida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.nuevo == 'si'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: NexClient ${{ steps.v.outputs.tag }}
          files: salida/*
          make_latest: true
          body: |
            NexClient para **Forge 1.8.9** y **Fabric 1.21.1** (esta necesita Fabric API).
            NexLauncher lo instala solo al jugar esas versiones. Dentro del juego: **Shift derecho** abre el menú.
